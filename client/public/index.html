<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>DevArticles — Read, write and share what you build</title>
    <meta
      name="description"
      content="DevArticles is a community platform where developers publish deep dives, quick notes and debugging stories. Browse by category, bookmark what matters, join the discussion."
    />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevArticles" />
    <meta property="og:title" content="DevArticles — Read, write and share what you build" />
    <meta
      property="og:description"
      content="A community space for developers to publish what they learn and read what others build."
    />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      /* Resolve the theme before first paint, so reloading in light mode
         never flashes the dark ground (or the other way round). */
      (function () {
        var t = "dark";
        try {
          var stored = localStorage.getItem("devarticles:theme");
          if (stored === "light" || stored === "dark") t = stored;
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute("data-theme", t);
        root.style.colorScheme = t;
        root.style.backgroundColor = t === "light" ? "#F4F6F9" : "#0A0D14";
        document.write(
          '<meta name="theme-color" content="' +
            (t === "light" ? "#F4F6F9" : "#0A0D14") +
            '">'
        );
      })();
    </script>

    <style>
      /* Ground colour comes from the inline script above so it is correct
         for the stored theme before the bundle and stylesheet arrive. */
      html,
      body,
      #root {
        min-height: 100%;
      }
      body {
        margin: 0;
        background-color: inherit;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", Roboto, sans-serif;
      }
      html[data-theme="light"] body {
        color: #334155;
      }
      html[data-theme="dark"] body {
        color: #cbd6e6;
      }
      .boot-note {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        font-size: 14px;
        color: #7a8aa3;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="boot-note">
        DevArticles needs JavaScript enabled to run.
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
